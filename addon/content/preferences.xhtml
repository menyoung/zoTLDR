<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <vbox>
    <label data-l10n-id="pref-highlights-label"></label>
    <html:textarea
      id="zotero-prefpane-__addonRef__-highlights"
      preference="highlights"
      rows="6"
      style="width: 100%; font-family: inherit; font-size: 13px; resize: vertical;"
    ></html:textarea>
    <description data-l10n-id="pref-highlights-description"></description>
  </vbox>

  <html:details style="margin-top: 12px;">
    <html:summary
      style="cursor: pointer; font-weight: bold;"
      data-l10n-id="pref-advanced-label"
    ></html:summary>
    <vbox style="margin-top: 8px;">
      <hbox align="center">
        <label data-l10n-id="pref-context-doc-label"></label>
        <html:input
          type="text"
          id="zotero-prefpane-__addonRef__-contextDocKey"
          style="flex: 1; margin-left: 8px;"
        />
        <button
          id="zotero-prefpane-__addonRef__-pickContextDoc"
          data-l10n-id="pref-pick-context-doc"
          style="margin-left: 4px;"
        />
      </hbox>
      <description
        id="zotero-prefpane-__addonRef__-contextDocStatus"
        style="margin-top: 4px; font-style: italic;"
      ></description>
      <hbox align="center" style="margin-top: 8px;">
        <label data-l10n-id="pref-batch-delay-label"></label>
        <html:input
          type="number"
          id="zotero-prefpane-__addonRef__-batchDelay"
          preference="batchDelay"
          style="width: 80px; margin-left: 8px;"
        />
      </hbox>
      <checkbox
        id="zotero-prefpane-__addonRef__-showBatchConfirm"
        preference="showBatchConfirm"
        data-l10n-id="pref-show-batch-confirm"
        style="margin-top: 8px;"
      />
    </vbox>
  </html:details>
</groupbox>
