<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>

  <vbox>
    <hbox align="center">
      <label data-l10n-id="pref-context-doc-label"></label>
      <html:input
        type="text"
        id="zotero-prefpane-__addonRef__-contextDocKey"
        style="flex: 1; margin-left: 8px"
      />
      <button
        id="zotero-prefpane-__addonRef__-pickContextDoc"
        data-l10n-id="pref-pick-context-doc"
        style="margin-left: 4px"
      />
    </hbox>
    <description
      id="zotero-prefpane-__addonRef__-contextDocStatus"
      style="margin-top: 4px; font-style: italic"
    ></description>
  </vbox>
</groupbox>
